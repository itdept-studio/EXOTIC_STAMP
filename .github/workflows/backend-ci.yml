name: Backend CI

on:
  pull_request:
  push:
    branches:
      # Remote evidence (exotic → EXOTIC_STAMP): HEAD is main.
      # Local history also uses master; keep both until remotes converge.
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify (CI profile)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Docker daemon
        run: docker info

      - name: Maven clean verify (CI)
        id: maven
        run: mvn -B -ntp clean verify -Pci

      - name: Assert Surefire/Failsafe reports
        if: always()
        env:
          ci.require-docker: "true"
        run: |
          if [ -d target/failsafe-reports ] || [ -d target/surefire-reports ]; then
            python scripts/ci/assert_test_reports.py --strict
          else
            echo "No Surefire/Failsafe reports found"
            exit 1
          fi

      - name: JaCoCo critical package diagnostics
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.xml ]; then
            python scripts/ci/jacoco_critical_packages.py
            python scripts/ci/jacoco_summary.py
          else
            echo "target/site/jacoco/jacoco.xml missing"
            exit 1
          fi

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: target/failsafe-reports/
          if-no-files-found: warn

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            target/site/jacoco/
            target/jacoco.exec
          if-no-files-found: warn

      - name: Upload packaged JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/ExoticStamp-*.jar
          if-no-files-found: error
